name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check Supabase config is present
        # Secrets are passed as environment variables, never pasted into the script text.
        env:
          URL_SET: ${{ secrets.VITE_SUPABASE_URL != '' }}
          KEY_SET: ${{ secrets.VITE_SUPABASE_ANON_KEY != '' }}
        run: |
          if [ "$URL_SET" != "true" ] || [ "$KEY_SET" != "true" ]; then
            echo "::error::Add VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY under Settings → Secrets and variables → Actions"
            exit 1
          fi
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # Public values only (project URL + anon key), kept as repository
          # secrets so they are not committed. NEVER add the service_role key.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
